name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cinna
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cinna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinna -d cinna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cinna:test-password@localhost:5432/cinna_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Generate and validate sqlc queries
        run: sqlc generate

      - name: Apply test database schema
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --file=db/schema.sql

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "The following files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build application
        run: go build ./cmd/cinna
